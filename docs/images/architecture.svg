<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0f172a">How it fits together</text>
  <!-- you -->
  <rect x="40" y="80" width="200" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="140" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">You</text>
  <text x="140" y="134" text-anchor="middle" font-size="13" fill="#475569">"help me win this hackathon"</text>
  <path d="M240 115 L330 115" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
  <!-- orchestrator -->
  <rect x="330" y="70" width="340" height="92" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="500" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Orchestrator skill</text>
  <text x="500" y="124" text-anchor="middle" font-size="13" fill="#7c2d12">routes each request · runs the 8 phases</text>
  <text x="500" y="143" text-anchor="middle" font-size="13" fill="#7c2d12">quality gates · scorecard · decisions</text>
  <!-- memory -->
  <rect x="740" y="70" width="220" height="250" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="850" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Project memory</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#14532d">
    <text x="762" y="130">HACKATHON_BRIEF.md</text><text x="762" y="152">IDEA_SCORECARD.md</text>
    <text x="762" y="174">PRODUCT_SPEC.md</text><text x="762" y="196">ARCHITECTURE.md</text>
    <text x="762" y="218">PROGRESS.md</text><text x="762" y="240">DECISION_LOG.md</text>
    <text x="762" y="262">RISK_REGISTER.md</text><text x="762" y="284">submission/*</text>
  </g>
  <path d="M670 116 L738 116" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M738 140 L670 140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- council -->
  <text x="40" y="215" font-size="15" font-weight="700" fill="#0f172a">The council (40 agents, called only when they're needed)</text>
  <path d="M500 162 L500 195" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="13">
    <rect x="40" y="230" width="215" height="90" rx="10" fill="#eef2ff" stroke="#818cf8"/>
    <text x="56" y="254" font-weight="700" fill="#3730a3">Council &amp; Strategy</text>
    <text x="56" y="276" fill="#312e81">rules, rubric, past winners,</text><text x="56" y="295" fill="#312e81">sponsors, red-team judge</text>
    <rect x="270" y="230" width="215" height="90" rx="10" fill="#fefce8" stroke="#eab308"/>
    <text x="286" y="254" font-weight="700" fill="#854d0e">Innovation</text>
    <text x="286" y="276" fill="#713f12">ideas, originality critic,</text><text x="286" y="295" fill="#713f12">feasibility, product manager</text>
    <rect x="500" y="230" width="215" height="90" rx="10" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="516" y="254" font-weight="700" fill="#155e75">Engineering (12)</text>
    <text x="516" y="276" fill="#164e63">architect, frontend, backend,</text><text x="516" y="295" fill="#164e63">AI/ML, QA, security, debugging</text>
    <rect x="40" y="335" width="215" height="90" rx="10" fill="#fdf4ff" stroke="#d946ef"/>
    <text x="56" y="359" font-weight="700" fill="#86198f">Design</text>
    <text x="56" y="381" fill="#701a75">UI/UX, visual, interaction,</text><text x="56" y="400" fill="#701a75">accessibility, demo experience</text>
    <rect x="270" y="335" width="215" height="90" rx="10" fill="#fef2f2" stroke="#ef4444"/>
    <text x="286" y="359" font-weight="700" fill="#991b1b">Presentation</text>
    <text x="286" y="381" fill="#7f1d1d">pitch, Devpost, slides,</text><text x="286" y="400" fill="#7f1d1d">demo video, critic</text>
    <rect x="500" y="335" width="215" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="516" y="359" font-weight="700" fill="#166534">Coding assistant</text>
    <text x="516" y="381" fill="#14532d">always available: build,</text><text x="516" y="400" fill="#14532d">debug, explain, push back</text>
  </g>
  <!-- infra -->
  <rect x="40" y="450" width="920" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="60" y="478" font-size="15" font-weight="700" fill="#0f172a">Your tools (detected, never assumed)</text>
  <text x="60" y="504" font-size="13" fill="#475569">Python scripts: init · detect environment · fetch rules · extract requirements · validate submission · project report</text>
  <text x="60" y="522" font-size="13" fill="#475569">Optional, if installed: Context7 · Firecrawl · Playwright · GitHub MCP · Serena · design skills</text>
</svg>
