name: tests

on:
  push:
  pull_request:

jobs:
  scripts:
    name: scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest   # Ubuntu 26.04 runners no longer ship Python 3.9
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Structure check (frontmatter, agent roster, references)
        run: python skills/hackathon-accelerator/scripts/tests/validate_system.py
      - name: Script tests (accelerator)
        run: python -m unittest discover -s skills/hackathon-accelerator/scripts/tests -v
      - name: Script tests (hackathon-ui)
        run: python -m unittest discover -s skills/hackathon-ui/scripts/tests -v

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin and marketplace manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
